name: enable-services
type: shell
commands:
  - systemctl enable cups.path
  - systemctl enable accounts-daemon.service
  - systemctl enable apparmor.service
  - systemctl enable cups.service
  - systemctl enable power-profiles-daemon.service
  - systemctl enable switcheroo-control.service
  - systemctl enable systemd-zram-setup@zram0.service
  - systemctl enable avahi-daemon.socket
  - systemctl enable cups.socket
  - systemctl enable dm-event.socket
  - systemctl enable netavark-dhcp-proxy.socket
  - systemctl enable fwupd-refresh.timer
  - systemctl enable man-db.timer
  - systemctl enable podman-auto-update.timer
modules:
  - name: clear-first-setup-steps-unit
    type: shell
    commands:
      - mkdir -p /etc/systemd/system/local-fs.target.wants/
      - ln -s /usr/lib/systemd/system/clear-first-setup-steps.service /etc/systemd/system/local-fs.target.wants/

  - name: apx-vso-pico-shutdown-service
    type: shell
    commands:
      - mkdir -p /etc/systemd/user/graphical-session.target.wants/
      - ln -s /etc/systemd/user/apx-vso-pico.service /etc/systemd/user/graphical-session.target.wants/

  - name: vso-enable-systemd-unit
    type: shell
    commands:
    - ln -s /usr/lib/systemd/system/vanilla-updates.service /etc/systemd/system/multi-user.target.wants/vanilla-updates.service
    - mkdir -p /etc/systemd/system/timers.target.wants
    - ln -s /usr/lib/systemd/system/vanilla-updates.timer /etc/systemd/system/timers.target.wants/vanilla-updates.timer
    - mkdir -p /usr/lib/systemd/user/default.target.wants
    - ln -s /usr/lib/systemd/user/vso-pre-run.service /usr/lib/systemd/user/default.target.wants/vso-pre-run.service
    - ln -s /usr/lib/systemd/user/vso-migrate-repo.service /usr/lib/systemd/user/default.target.wants/vso-migrate-repo.service
    - ln -s /usr/lib/systemd/user/vso-tasks-rotation.service /usr/lib/systemd/user/default.target.wants/vso-tasks-rotation.service

  - name: disable-pacmand-sockets
    type: shell
    commands:
      - rm -f /usr/lib/systemd/system/sockets.target.wants/*etc-pacman.d-gnupg.socket

  - name: ensure-lvm-fix-executable
    type: shell
    commands:
      - chmod +x /usr/lib/dracut/modules.d/90lvm-fix/*
